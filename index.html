<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Эврика! — физика в космосе</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6FED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Эврика!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB;
  --bg2:#EAF0FA;
  --panel:#FFFFFF;
  --line:#E1E7F1;
  --ink:#1B2333;
  --ink-soft:#657089;
  --blue:#3D6FE0;
  --blue-deep:#28469E;
  --orange:#F0975A;
  --orange-deep:#D97A3D;
  --green:#2FA786;
  --pink:#DB5C82;
  --gold:#C79A3D;
  --silver:#8C93A6;
  --bronze:#A6713F;
  --shadow: 0 18px 40px -22px rgba(25,45,90,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, #DCEBFF 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #FFE9DA 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Golos Text',sans-serif;}
.app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:40px;height:40px;border-radius:50%;background:conic-gradient(from 200deg, var(--blue), var(--orange), var(--blue));position:relative;box-shadow:var(--shadow);}
.brand-mark::after{content:"";position:absolute;inset:9px;background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.brand-text{font-family:'Golos Text';font-weight:800;font-size:19px;letter-spacing:.2px;}
.brand-text span{color:var(--blue);}
.crumbs{font-size:13px;color:var(--ink-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.crumbs b{color:var(--ink);cursor:pointer;font-weight:700;}
.crumbs b:hover{color:var(--blue);}
.crumb-sep{opacity:.5;}
.student-chip{font-size:12px;font-weight:700;color:var(--blue-deep);background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:100px;cursor:default;white-space:nowrap;}

/* ---------- auth screen ---------- */
.auth-wrap{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0;}
.auth-card{width:100%;max-width:420px;padding:34px 30px;}
.auth-note{max-width:420px;text-align:center;color:var(--ink-soft);font-size:12px;margin-top:16px;line-height:1.6;}
.auth-role-toggle{display:flex;gap:8px;margin-bottom:16px;background:var(--bg2);border-radius:100px;padding:4px;}
.role-btn{flex:1;border:none;background:transparent;padding:10px 6px;border-radius:100px;font-family:'Manrope';font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;}
.role-btn.active{background:#fff;color:var(--blue-deep);box-shadow:0 4px 10px -4px rgba(20,40,90,.25);}

/* ---------- teacher dashboard ---------- */
.teacher-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px;}
.teacher-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.teacher-toolbar input, .teacher-toolbar select{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Manrope';font-size:13.5px;}
.stat-mini-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.stat-mini{flex:1;min-width:120px;background:var(--bg2);border-radius:14px;padding:14px 16px;}
.stat-mini .sm-val{font-family:'Golos Text';font-weight:800;font-size:20px;}
.stat-mini .sm-lab{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.table-scroll{width:100%;overflow-x:auto;}
.bar-track{background:var(--bg2);border-radius:8px;height:10px;overflow:hidden;min-width:80px;}
.bar-fill{background:var(--blue);height:100%;border-radius:8px;}

/* ---------- survey ---------- */
.survey-panel{padding:30px;margin-top:44px;}
.survey-q{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.survey-q:last-of-type{border-bottom:none;}
.survey-q-text{font-weight:700;font-size:14.5px;margin-bottom:10px;}
.survey-opts{display:flex;flex-direction:column;gap:8px;}
.survey-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:13.5px;}
.survey-opt.picked{border-color:var(--blue);background:var(--bg2);}
.survey-open{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Manrope';font-size:13.5px;resize:vertical;min-height:64px;}
.survey-other-input{margin-top:6px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);width:100%;font-family:'Manrope';font-size:13px;}


.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);}

/* ---------- SPLASH ---------- */
.splash{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#101826 0%,#1B2A4A 55%,#2F6FED 130%);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:1;transition:opacity 1s ease;pointer-events:none;}
.splash.hide{opacity:0;}
.splash h1{color:#fff;font-size:38px;margin:0;opacity:0;animation:splashIn 2.6s ease forwards;text-align:center;padding:0 20px;}
.splash .sub{color:#AEC3E8;font-size:14px;margin-top:10px;opacity:0;animation:splashIn 2.6s ease forwards;animation-delay:.15s;}
@keyframes splashIn{0%{opacity:0;transform:translateY(10px);}15%{opacity:1;transform:translateY(0);}80%{opacity:1;}100%{opacity:0;}}

/* ---------- HOME ---------- */
.hero{position:relative;padding:52px 44px;overflow:hidden;border-radius:26px;background:linear-gradient(135deg,#EAF1FF 0%,#F7FBFF 55%,#FFEFE2 100%);border:1px solid var(--line);}
.hero-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--blue-deep);background:#fff;border:1px solid var(--line);padding:6px 14px;border-radius:100px;margin-bottom:18px;}
.hero h1{font-size:44px;line-height:1.08;margin:0 0 14px;max-width:620px;font-weight:800;}
.hero p{font-size:17px;color:var(--ink-soft);max-width:520px;line-height:1.55;margin:0 0 26px;}
.hero-craft{position:absolute;right:10px;top:18px;width:220px;height:220px;pointer-events:none;z-index:0;opacity:.95;}
.hero h1,.hero p,.hero .hero-tag,.hero .btn{position:relative;z-index:1;}
.topic-icon{font-size:22px;line-height:1;opacity:.9;}
@media(max-width:760px){ .hero-craft{display:none;} }
.btn{font-family:'Manrope';font-weight:700;font-size:15px;border:none;cursor:pointer;padding:15px 26px;border-radius:100px;transition:transform .15s ease, box-shadow .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:#fff;box-shadow:0 14px 26px -12px rgba(16,24,38,.5);}
.btn-primary:hover{background:var(--blue-deep);}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue-deep);}

.section-title{font-size:22px;font-weight:800;margin:44px 0 6px;}
.section-sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 22px;}

/* section / topic lists */
.dock-grid{display:flex;flex-direction:column;gap:14px;}
.dock{display:flex;align-items:center;gap:18px;padding:20px 24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:.15s;}
.dock:hover{border-color:var(--blue);transform:translateX(4px);}
.dock-icon{width:46px;height:46px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
.dock-body h3{margin:0 0 3px;font-size:16.5px;font-weight:700;}
.dock-body p{margin:0;font-size:13px;color:var(--ink-soft);}
.dock-arrow{margin-left:auto;color:var(--ink-soft);font-size:20px;}

.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.topic-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;transition:.15s;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;}
.topic-card:hover{border-color:var(--blue);transform:translateY(-4px);box-shadow:var(--shadow);}
.topic-card h4{font-size:15.5px;margin:0;font-weight:700;line-height:1.35;}
.badge{align-self:flex-start;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:100px;letter-spacing:.3px;}
.badge-ready{background:#E8F9F1;color:var(--green);}
.badge-soon{background:#F1F3F8;color:var(--ink-soft);}
.topic-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.topic-play{font-size:12.5px;font-weight:700;color:var(--blue-deep);}

/* coming soon modal / generic modal */
.overlay{position:fixed;inset:0;background:rgba(16,24,38,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:30px;box-shadow:0 30px 60px -20px rgba(16,24,38,.4);}
.modal h3{margin:0 0 10px;font-size:19px;}
.modal p{color:var(--ink-soft);font-size:14px;line-height:1.6;}
.modal .formula-chip{display:inline-block;background:var(--bg2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-family:'Golos Text';font-weight:700;margin:10px 0;}
.modal-close{margin-top:16px;}
.modal-input{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;font-family:'Manrope';margin:12px 0;}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.modal-actions .btn{flex:1;}

/* ---------- MISSION (flagship) ---------- */
.mission-hero{position:relative;border-radius:26px;overflow:hidden;padding:48px 40px;background:linear-gradient(120deg,#101826 0%,#1B2A4A 55%,#2F6FED 130%);color:#fff;}
.mission-hero .hero-tag{background:rgba(255,255,255,.12);color:#CFE0FF;border:1px solid rgba(255,255,255,.18);}
.mission-hero h1{color:#fff;max-width:640px;}
.mission-hero p{color:#C4D3EE;max-width:540px;}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%, #fff 40%, transparent), radial-gradient(1.5px 1.5px at 70% 60%, #fff 40%, transparent), radial-gradient(1px 1px at 40% 80%, #fff 40%, transparent), radial-gradient(1.5px 1.5px at 90% 20%, #fff 40%, transparent), radial-gradient(1px 1px at 55% 15%, #fff 30%, transparent);opacity:.5;}
.char-row{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap;}
.char-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 14px 8px 8px;border-radius:100px;}
.char-avatar{width:34px;height:34px;border-radius:50%;flex:none;}
.char-name{font-size:12.5px;font-weight:700;color:#fff;}
.char-role{font-size:11px;color:#AEC3E8;}

.stepper{display:flex;gap:8px;margin:26px 0 6px;flex-wrap:wrap;}
.step-pill{font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:100px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;}
.step-pill.active{border-color:var(--blue);color:var(--blue-deep);background:#EAF1FF;}
.step-pill.done{color:var(--green);border-color:#BEEAD8;}

.story-card{display:flex;gap:22px;padding:28px;align-items:flex-start;}
.avatar-lg{width:74px;height:74px;border-radius:50%;flex:none;box-shadow:var(--shadow);}
.story-text h3{margin:0 0 8px;font-size:18px;}
.story-text p{margin:0 0 10px;color:var(--ink-soft);font-size:15px;line-height:1.65;}
.story-text .speaker{font-weight:800;color:var(--ink);font-family:'Golos Text';font-size:13px;text-transform:none;letter-spacing:.2px;margin-bottom:4px;}

.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;}
@media(max-width:820px){.two-col{grid-template-columns:1fr;}}

.formula-box{background:linear-gradient(135deg,#101826,#1B2A4A);color:#fff;border-radius:16px;padding:22px 24px;font-family:'Golos Text';margin:14px 0;}
.formula-box .f-title{font-size:12px;color:#9EB6E8;font-weight:700;margin-bottom:8px;}
.formula-box .f-main{font-size:26px;font-weight:800;}
.formula-box .f-sub{font-size:12.5px;color:#B9CBEF;margin-top:8px;font-family:'Manrope';font-weight:500;}

.legend-box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:6px 0 14px;}
.legend-title{font-weight:800;font-size:12.5px;color:var(--blue-deep);margin-bottom:10px;text-transform:none;}
.legend-row{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:13px;border-top:1px dashed var(--line);}
.legend-row:first-of-type{border-top:none;}
.legend-sym{font-family:'Golos Text';font-weight:800;color:var(--ink);min-width:52px;flex:none;}
.legend-desc{flex:1;color:var(--ink);}
.legend-unit{color:var(--ink-soft);font-size:12px;flex:none;text-align:right;}

.sim-instructions{background:#FFF8EF;border:1.5px solid #F6E2C4;border-radius:14px;padding:16px 20px;margin-bottom:16px;}
.sim-instructions-title{font-weight:800;font-size:13px;color:var(--orange-deep);margin-bottom:8px;}
.sim-instructions ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink);line-height:1.65;}
.sim-example{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:#fff;border-radius:10px;padding:10px 12px;}

.prop-row{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;}
.prop-card{flex:1;min-width:200px;border-radius:14px;padding:16px;font-size:13px;border:1.5px solid var(--line);}
.prop-card.direct{background:#EAF9F2;border-color:#BEEAD8;}
.prop-card.inverse{background:#FEEDF1;border-color:#F6C4D2;}
.prop-card .p-tag{font-weight:800;font-family:'Golos Text';font-size:13px;margin-bottom:4px;}
.prop-card.direct .p-tag{color:var(--green);}
.prop-card.inverse .p-tag{color:var(--pink);}

.fact-card{padding:22px;margin-bottom:14px;display:flex;gap:16px;}
.fact-icon{font-size:26px;flex:none;}
.fact-card h4{margin:0 0 6px;font-size:15px;}
.fact-card p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.6;}

/* simulator */
.sim-wrap{padding:26px;}
.sim-canvas-wrap{background:linear-gradient(180deg,#EAF1FF,#F7FBFF);border-radius:16px;border:1px solid var(--line);padding:10px;}
canvas{display:block;width:100%;border-radius:12px;}
.sim-controls{margin-top:18px;display:flex;flex-direction:column;gap:16px;}
.slider-row label{font-size:13px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:6px;}
.slider-row input[type=range]{width:100%;accent-color:var(--blue);}
.sim-readout{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;}
.readout-chip{flex:1;min-width:110px;background:var(--bg2);border-radius:12px;padding:12px;text-align:center;}
.readout-chip .r-val{font-family:'Golos Text';font-weight:800;font-size:20px;}
.readout-chip .r-lab{font-size:11px;color:var(--ink-soft);margin-top:2px;}

/* arena */
.arena-map{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:20px 4px 10px;}
.arena-node{flex:none;width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink-soft);}
.arena-node.done{background:var(--green);border-color:var(--green);color:#fff;}
.arena-node.current{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 5px #DCE9FF;}
.arena-line{flex:1;height:3px;background:var(--line);min-width:14px;}
.arena-line.done{background:var(--green);}

.task-card{padding:30px;}
.task-tag{font-size:11.5px;font-weight:800;color:var(--blue-deep);background:#EAF1FF;padding:5px 12px;border-radius:100px;display:inline-block;margin-bottom:14px;}
.task-prompt{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:20px;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;font-size:14.5px;font-family:'Manrope';margin-bottom:10px;cursor:pointer;transition:.12s;}
.opt:hover{border-color:var(--blue);}
.opt.correct{border-color:var(--green);background:#EAF9F2;}
.opt.wrong{border-color:var(--pink);background:#FEEDF1;}
.explain{margin-top:16px;padding:16px 18px;background:var(--bg2);border-radius:14px;font-size:13.5px;color:var(--ink-soft);line-height:1.6;display:none;}
.task-nav{display:flex;justify-content:space-between;margin-top:22px;}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.match-col{display:flex;flex-direction:column;gap:10px;}
.match-term,.match-def{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13.5px;font-family:'Manrope';transition:.12s;}
.match-term:hover,.match-def:hover{border-color:var(--blue);}
.match-term.selected{border-color:var(--blue);background:#EAF1FF;}
.match-term.matched,.match-def.matched{border-color:var(--green);background:#EAF9F2;opacity:.6;pointer-events:none;}
.match-term.wrong,.match-def.wrong{border-color:var(--pink)!important;background:#FEEDF1!important;}
.match-hint{color:var(--ink-soft);font-size:13px;margin-top:14px;}
.exp-msg-ok{color:var(--green);font-weight:700;font-size:14px;}
.exp-msg-no{color:var(--pink);font-weight:700;font-size:14px;}

.reward-wrap{padding:60px 30px;text-align:center;}
.capsule{width:140px;height:140px;border-radius:50%;margin:0 auto 26px;background:radial-gradient(circle at 35% 30%, #fff, var(--orange) 60%, var(--orange-deep));box-shadow:0 20px 50px -18px rgba(230,112,31,.6);display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;transition:transform .2s;}
.capsule:hover{transform:scale(1.05);}
.capsule.gold{background:radial-gradient(circle at 35% 30%, #fff, #F1CB5C 55%, var(--gold));box-shadow:0 20px 50px -18px rgba(212,167,44,.6);}
.capsule.silver{background:radial-gradient(circle at 35% 30%, #fff, #C7CEDC 55%, var(--silver));box-shadow:0 20px 50px -18px rgba(138,147,166,.6);}
.capsule.bronze{background:radial-gradient(circle at 35% 30%, #fff, #D08B54 55%, var(--bronze));box-shadow:0 20px 50px -18px rgba(176,105,47,.6);}
.reward-result{margin-top:24px;padding:22px 26px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;display:none;max-width:420px;margin-left:auto;margin-right:auto;}
.reward-result h3{margin:0 0 6px;color:var(--orange-deep);}
.reward-result p{margin:0;color:var(--ink-soft);font-size:14px;}
.reward-tier-label{display:inline-block;font-size:11px;font-weight:800;padding:4px 12px;border-radius:100px;margin-bottom:10px;letter-spacing:.3px;}
.reward-tier-label.gold{background:#FBF1D6;color:#8A6A0F;}
.reward-tier-label.silver{background:#EEF0F4;color:#5B6B85;}
.reward-tier-label.bronze{background:#F6E6DA;color:#8A4B1F;}

.footer-note{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:60px;}
.roadmap-note{margin-top:40px;padding:18px 22px;border:1.5px dashed var(--line);border-radius:16px;font-size:13px;color:var(--ink-soft);background:#fff;}

/* ---------- crossword ---------- */
.cross-grid{display:flex;flex-direction:column;gap:14px;margin-top:10px;}
.cross-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.cross-num{font-family:'Golos Text';font-weight:800;color:var(--blue-deep);width:22px;flex:none;}
.cross-clue{flex:1;min-width:160px;font-size:13.5px;color:var(--ink-soft);}
.cross-letters{display:flex;gap:4px;}
.cross-cell{width:30px;height:34px;border:1.5px solid var(--line);border-radius:6px;text-align:center;font-family:'Golos Text';font-weight:800;font-size:15px;text-transform:uppercase;background:#fff;padding:0;}
.cross-cell.correct{border-color:var(--green);background:#EAF9F2;}
.cross-cell.wrong{border-color:var(--pink);background:#FEEDF1;}

/* ---------- wheel of fortune ---------- */
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 4px;}
.wheel-outer{position:relative;width:280px;height:280px;max-width:80vw;max-height:80vw;}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:22px solid var(--ink);z-index:3;}
.wheel-disk{width:100%;height:100%;border-radius:50%;position:relative;box-shadow:var(--shadow);transition:transform 4s cubic-bezier(.15,.7,.25,1);border:6px solid #fff;}
.wheel-label{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:11px;font-weight:800;color:#fff;width:100px;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.wheel-sub{width:100%;margin-top:6px;}

/* ---------- extra interactive formats ---------- */
.flip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
.flip-card{height:190px;perspective:900px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border:1.5px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fff;}
.flip-front{background:linear-gradient(135deg,#EAF1FF,#F7FBFF);}
.flip-back{transform:rotateY(180deg);background:#EAF9F2;border-color:#BEEAD8;}
.flip-front .flip-mark{font-size:28px;margin-bottom:10px;}
.flip-front h4,.flip-back h4{margin:0 0 8px;font-size:15px;}
.flip-front p,.flip-back p{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.5;}
.sequence-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.sequence-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;font-size:13.5px;text-align:left;}
.sequence-item:hover{border-color:var(--blue);}
.sequence-item.selected{background:#EAF1FF;border-color:var(--blue);}
.sequence-item.correct-pos{background:#EAF9F2;border-color:var(--green);}
.sequence-item.wrong-pos{background:#FEEDF1;border-color:var(--pink);}
.sequence-num{width:28px;height:28px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;}
.sequence-status{margin-top:12px;font-size:13.5px;font-weight:700;}
@media(max-width:720px){.flip-grid{grid-template-columns:1fr;}.flip-card{height:160px;}}

/* ---------- results ---------- */
.results-table{width:100%;border-collapse:collapse;margin-top:10px;}
.results-table th,.results-table td{text-align:left;padding:12px 10px;font-size:13.5px;border-bottom:1px solid var(--line);}
.results-table th{color:var(--ink-soft);font-weight:700;font-size:12px;text-transform:none;}
.results-empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
.pill-tier{font-size:11px;font-weight:800;padding:3px 10px;border-radius:100px;}
.pill-tier.gold{background:#FBF1D6;color:#8A6A0F;}
.pill-tier.silver{background:#EEF0F4;color:#5B6B85;}
.pill-tier.bronze{background:#F6E6DA;color:#8A4B1F;}

      m.tasks.push({

        type:'crossword',
        prompt:'Разгадай мини-кроссворд по теме. Печатай слово целиком — буквы сами встанут по клеткам.',
        words:CROSSWORDS[id],
        explain:'Все слова связаны с основной формулой и понятиями этой миссии.'

/* ================= ХРАНИЛИЩЕ: пользователи, сессия, результаты, опрос =================
   ВАЖНО (демо-ограничение): вход и хранение данных реализованы средствами браузера
   (localStorage) в пределах одного файла — без backend-сервера. Это значит:
   - данные видны и доступны только на этом устройстве/в этом браузере;
   - пароль хранится не в открытом виде, а в виде простого числового хэша, но это
     НЕ криптографическая защита (не bcrypt/Argon2) — для настоящего постоянного и
     защищённого хранения нужен сервер и база данных (например, Node.js + PostgreSQL
     или Firebase Authentication/Firestore), куда данные можно перенести позже.
   Реализованная здесь система — полноценная рабочая демонстрация входа, ролей и
   хранения результатов, но не production-решение для реальной школьной сети. */
const USERS_KEY = 'eureka_users_v1';
const SESSION_KEY = 'eureka_session_v1';
const RESULTS_KEY = 'eureka_results_v2';
const SURVEY_KEY = 'eureka_survey_v1';
const TEACHER_CODE = 'UCHITEL2026'; // демонстрационный код доступа для регистрации учителя

function loadUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }catch(e){ return {}; } }
function saveUsers(u){ try{ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }catch(e){} }
function simpleHash(str){
  // Простой демонстрационный хэш (НЕ криптографический). Нужен только чтобы не хранить
  // пароль в явном виде в localStorage. Для реальной защиты — хэширование на сервере.
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return 'h' + (h>>>0).toString(36);
}
function getSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if(!s || !s.email) return null;
    const users = loadUsers();
    return users[s.email] || null;
  }catch(e){ return null; }
}
function setSession(email){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify({email})); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

function loadResults(){
  try{ return JSON.parse(localStorage.getItem(RESULTS_KEY)) || {}; }catch(e){ return {}; }
}
function saveResults(r){
  try{ localStorage.setItem(RESULTS_KEY, JSON.stringify(r)); }catch(e){}
}
function recordAttempt(missionId, score, total, correctCount, wrongCount, tier, rewardItem, durationSec){
  const session = getSession();
  if(!session) return null;
  const percent = total>0 ? Math.round((score/total)*100) : 0;
  const score10 = percentToScore10(percent);
  const rec = {
    email: session.email, name: session.name,
    className: session.role==='teacher' ? '—' : (session.className || '—'),
    role: session.role,
    score, total, correct: correctCount, wrong: wrongCount, percent, score10,
    tier: tier || null,
    rewardTitle: rewardItem ? rewardItem.title : null,
    rewardShort: rewardItem ? rewardItem.short : null,
    durationSec: Math.max(0, Math.round(durationSec||0)),
    ts: Date.now()
  };
  const all = loadResults();
  if(!all[missionId]) all[missionId] = [];
  all[missionId].push(rec);
  saveResults(all);
  return rec;
}

function doRegister(){
  const name=(document.getElementById('regName').value||'').trim();
  const email=(document.getElementById('regEmail').value||'').trim().toLowerCase();
  const pass=(document.getElementById('regPass').value||'');
  const role = state.regRole==='teacher' ? 'teacher' : 'student';
  if(!name||!email||!pass){ state.authError='Заполни имя, почту и пароль.'; render(); return; }
  if(!email.includes('@') || !email.includes('.')){ state.authError='Проверь адрес электронной почты.'; render(); return; }
  if(pass.length<4){ state.authError='Пароль должен быть не короче 4 символов.'; render(); return; }
  let className=null;
  if(role==='student'){
    className=document.getElementById('regClass').value;
    if(!className){ state.authError='Выбери свой класс.'; render(); return; }
  } else {
    const code=(document.getElementById('regTeacherCode').value||'').trim();
    if(code!==TEACHER_CODE){ state.authError='Неверный код доступа учителя.'; render(); return; }
  }
  const users = loadUsers();
  if(users[email]){ state.authError='Этот email уже зарегистрирован — попробуй войти.'; render(); return; }
  users[email] = {name, email, passHash: simpleHash(pass), role, className};
  saveUsers(users);
  setSession(email);
  state.authError=''; state.view='home';
  render();
}
function doLogin(){
  const email=(document.getElementById('loginEmail').value||'').trim().toLowerCase();
  const pass=(document.getElementById('loginPass').value||'');
  const users = loadUsers();
  const u = users[email];
  if(!u || u.passHash!==simpleHash(pass)){ state.authError='Неверная почта или пароль.'; render(); return; }
  setSession(email);
  state.authError=''; state.view='home';
  render();
}

function renderResults(){

function renderTeacherResults(){
  const allResults = loadResults();
  const missionIds = Object.keys(MISSIONS);
  let rows = [];
  missionIds.forEach(mid=>{
    (allResults[mid]||[]).forEach(r=>{
      rows.push({...r, missionId:mid, missionLabel: MISSIONS[mid].crumbLabel});
    });
  });

  const classFilter = state.teacherClassFilter || 'all';
  const missionFilter = state.teacherMissionFilter || 'all';
  const search = (state.teacherSearch||'').trim().toLowerCase();
  const sortBy = state.teacherSort || 'date_desc';

  let filtered = rows.filter(r=>{
    if(classFilter!=='all' && r.className!==classFilter) return false;
    if(missionFilter!=='all' && r.missionId!==missionFilter) return false;
    if(search && !(r.name||'').toLowerCase().includes(search) && !(r.email||'').toLowerCase().includes(search)) return false;
    return true;
  });
  if(sortBy==='percent_desc') filtered.sort((a,b)=>b.percent-a.percent);
  else if(sortBy==='percent_asc') filtered.sort((a,b)=>a.percent-b.percent);
  else if(sortBy==='class') filtered.sort((a,b)=>(a.className||'').localeCompare(b.className||'')||b.ts-a.ts);
  else filtered.sort((a,b)=>b.ts-a.ts); // date_desc по умолчанию

  const uniqueStudents = new Set(filtered.map(r=>r.email)).size;
  const avgPercent = filtered.length ? Math.round(filtered.reduce((s,r)=>s+r.percent,0)/filtered.length) : 0;

      <select onchange="state.teacherClassFilter=this.value;render()">
        <option value="all" ${classFilter==='all'?'selected':''}>Все классы</option>
        ${CLASS_OPTIONS.map(c=>`<option value="${c}" ${classFilter===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <select onchange="state.teacherMissionFilter=this.value;render()">
        <option value="all" ${missionFilter==='all'?'selected':''}>Все темы</option>
        ${missionIds.map(id=>`<option value="${id}" ${missionFilter===id?'selected':''}>${MISSIONS[id].crumbLabel}</option>`).join('')}
      </select>
      <select onchange="state.teacherSort=this.value;render()">
        <option value="date_desc" ${sortBy==='date_desc'?'selected':''}>Сначала новые</option>
        <option value="percent_desc" ${sortBy==='percent_desc'?'selected':''}>Результат: сначала лучшие</option>
        <option value="percent_asc" ${sortBy==='percent_asc'?'selected':''}>Результат: сначала худшие</option>
        <option value="class" ${sortBy==='class'?'selected':''}>По классу</option>
      </select>
    </div>
    <div class="table-scroll">
    <table class="results-table" id="teacherTable">
      <thead><tr><th>Ученик</th><th>Класс</th><th>Тема</th><th>Результат</th><th>/10</th><th>Верно/всего</th><th>Время</th><th>Дата</th><th>Награда</th></tr></thead>
      <tbody>
        ${filtered.length===0 ? `<tr><td colspan="9" style="text-align:center;color:var(--ink-soft);padding:24px">Ничего не найдено по текущим фильтрам.</td></tr>` :
          filtered.map(r=>`<tr>
            <td>${r.name}</td>
            <td>${r.className}</td>
            <td>${r.missionLabel}</td>
            <td>${r.percent}%</td>
            <td><b>${r.score10}</b></td>
            <td>${r.correct}/${r.total}</td>
            <td>${r.durationSec?formatDuration(r.durationSec):'—'}</td>
            <td>${new Date(r.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
            <td>${r.tier?`<span class="pill-tier ${r.tier}">${TIER_SHORT[r.tier]}</span>`:`<span class="pill-tier none">—</span>`}</td>
          </tr>`).join('')}

    </table>
    </div>`;
}
// лёгкое обновление только таблицы при вводе в поиск, чтобы не терять фокус инпута
function renderTeacherPartial(){

function renderSurveyBlock(){
  const session = getSession();
  if(!session || session.role==='teacher') return ''; // опрос только для учеников
  const surveys = loadSurveys();
  const mine = surveys.find(s=>s.email===session.email);
  if(mine && !state.surveyEditing){
    return `
    <div class="panel survey-panel">
      <h3 style="margin-top:0">Спасибо за отзыв о сайте! 🎉</h3>
      <p style="color:var(--ink-soft);font-size:14px">Ты уже прошёл(ла) опрос ${new Date(mine.ts).toLocaleDateString('ru-RU')}. Мнение помогает сделать «Эврику!» лучше.</p>
      <button class="btn btn-ghost" onclick="state.surveyEditing=true;render()">Пройти опрос заново</button>
    </div>`;
  }
  if(!state.surveyAnswers) state.surveyAnswers = {};
  if(!state.surveyOtherText) state.surveyOtherText = {};
  if(!state.surveyOpenAnswers) state.surveyOpenAnswers = {};
  return `
  <div class="panel survey-panel">
    <h3 style="margin-top:0">Опрос: что ты думаешь о сайте?</h3>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-8px">Займёт 1–2 минуты. Это не проверка знаний — просто твоё мнение о самом сайте.</p>
    ${SURVEY_QUESTIONS.map(q=>`
      <div class="survey-q">
        <div class="survey-q-text">${q.text}</div>
        <div class="survey-opts">
          ${q.options.map((o,i)=>`<div class="survey-opt ${state.surveyAnswers[q.id]===i?'picked':''}" onclick="pickSurveyOption('${q.id}',${i})"><span>${state.surveyAnswers[q.id]===i?'●':'○'}</span><span>${o}</span></div>`).join('')}
          ${q.other?`<div class="survey-opt ${state.surveyAnswers[q.id]==='other'?'picked':''}" onclick="pickSurveyOption('${q.id}','other')"><span>${state.surveyAnswers[q.id]==='other'?'●':'○'}</span><span>Другое:</span></div>`:''}
          ${q.other && state.surveyAnswers[q.id]==='other' ? `<input class="survey-other-input" placeholder="Напиши свой вариант" value="${state.surveyOtherText[q.id]||''}" oninput="state.surveyOtherText['${q.id}']=this.value">`:''}
        </div>
      </div>`).join('')}
    ${SURVEY_OPEN.map(o=>`
      <div class="survey-q">
        <div class="survey-q-text">${o.text}</div>
        <textarea class="survey-open" placeholder="Напиши здесь (необязательно)..." oninput="state.surveyOpenAnswers['${o.id}']=this.value">${state.surveyOpenAnswers[o.id]||''}</textarea>
      </div>`).join('')}
    <div id="surveyMsg" style="color:var(--pink);font-weight:700;font-size:13px;margin-bottom:10px"></div>
    <button class="btn btn-primary" onclick="submitSurvey()">Отправить ответ →</button>
  </div>`;

function pickSurveyOption(qid, idx){
  state.surveyAnswers[qid] = idx;
  render();
}
function submitSurvey(){
  const session = getSession();
  if(!session) return;
  for(const q of SURVEY_QUESTIONS){
    if(state.surveyAnswers[q.id]===undefined){
      document.getElementById('surveyMsg').textContent = 'Пожалуйста, ответь на все вопросы с вариантами — осталось: «'+q.text+'»';
      document.getElementById('surveyMsg').scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
  }
  const answers = {};
  SURVEY_QUESTIONS.forEach(q=>{
    const a = state.surveyAnswers[q.id];
    answers[q.id] = a==='other' ? ('Другое: '+(state.surveyOtherText[q.id]||'').trim()) : q.options[a];
  });
  const openAnswers = {};
  SURVEY_OPEN.forEach(o=>{ openAnswers[o.id] = (state.surveyOpenAnswers[o.id]||'').trim(); });
  let surveys = loadSurveys();
  surveys = surveys.filter(s=>s.email!==session.email);
  surveys.push({email:session.email, name:session.name, className:session.className||'—', answers, openAnswers, ts:Date.now()});
  saveSurveys(surveys);
  state.surveyAnswers={}; state.surveyOtherText={}; state.surveyOpenAnswers={}; state.surveyEditing=false;
  render();
  try{ window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); }catch(e){}
}

function renderSurveyDashboard(){
  const surveys = loadSurveys();
  if(surveys.length===0){
    return `<div class="results-empty">Пока никто не прошёл опрос о сайте. Результаты появятся здесь после первых ответов учеников.</div>`;
  }
  // средняя оценка сайта (вопрос q8, число в начале строки ответа)
  let ratingSum=0, ratingCount=0;
  surveys.forEach(s=>{
    const ans = s.answers['q8']||'';
    const n = parseInt(ans,10);
    if(!isNaN(n)){ ratingSum+=n; ratingCount++; }
  });
  const avgRating = ratingCount ? (ratingSum/ratingCount).toFixed(1) : '—';

  const distHtml = SURVEY_QUESTIONS.map(q=>{
    const counts = {};
    q.options.forEach(o=>counts[o]=0);
    let otherCount=0;
    surveys.forEach(s=>{
      const a = s.answers[q.id];
      if(a && a.startsWith('Другое:')) otherCount++;
      else if(a!==undefined && counts[a]!==undefined) counts[a]++;
    });
    const max = Math.max(1, ...Object.values(counts), otherCount);
    return `<div class="survey-q">
      <div class="survey-q-text">${q.text}</div>
      ${q.options.map(o=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px">

          <div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${Math.round((counts[o]/max)*100)}%"></div></div>
          <div style="width:24px;text-align:right;font-weight:700">${counts[o]}</div>
        </div>`).join('')}
      ${q.other && otherCount>0?`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px">
          <div style="width:170px;flex:none;color:var(--ink-soft)">Другое</div>
          <div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${Math.round((otherCount/max)*100)}%;background:var(--orange)"></div></div>
          <div style="width:24px;text-align:right;font-weight:700">${otherCount}</div>
        </div>`:''}
    </div>`;
  }).join('');

  const likedList = surveys.map(s=>s.openAnswers['o1']).filter(Boolean);
  const suggestList = surveys.map((s,i)=>({name:surveys[i].name, text:s.openAnswers['o2']})).filter(x=>x.text);

  return `
    <div class="stat-mini-row">
      <div class="stat-mini"><div class="sm-val">${surveys.length}</div><div class="sm-lab">ответивших учеников</div></div>
      <div class="stat-mini"><div class="sm-val">${avgRating}/5</div><div class="sm-lab">средняя оценка сайта</div></div>
    </div>
    <h4 style="margin:18px 0 4px">Распределение ответов по вопросам</h4>
    ${distHtml}
    <h4 style="margin:18px 0 4px">Что понравилось больше всего (ответы учеников)</h4>
    ${likedList.length ? `<ul style="color:var(--ink-soft);font-size:13.5px;line-height:1.8;padding-left:20px">${likedList.map(t=>`<li>${t}</li>`).join('')}</ul>` : `<p style="color:var(--ink-soft);font-size:13px">Пока никто не оставил комментарий.</p>`}
    <h4 style="margin:18px 0 4px">Предложения и замечания</h4>
    ${suggestList.length ? `<ul style="color:var(--ink-soft);font-size:13.5px;line-height:1.8;padding-left:20px">${suggestList.map(x=>`<li><b>${x.name}:</b> ${x.text}</li>`).join('')}</ul>` : `<p style="color:var(--ink-soft);font-size:13px">Пока нет предложений.</p>`}
  `;
}

  return `
  <div class="sim-instructions">
    <div class="sim-instructions-title">📋 Как работать с симулятором</div>

      <li>Подвигай ползунок «<b>${s.p1.label}</b>» и посмотри, как меняется значение «${s.resultLabel}» справа и рисунок сверху.</li>

      <li>Понаблюдай за анимацией: она показывает происходящее на модели в реальном времени.</li>

    <div class="sim-example">💡 Пример: при «${s.p1.label}» = ${s.p1.def} ${s.p1.unit} и «${s.p2.label}» = ${s.p2.def} ${s.p2.unit} получаем «${s.resultLabel.toLowerCase()}» ≈ ${example} ${s.resultUnit}. Попробуй повторить это же значение на ползунках, а затем поменяй его.</div>

}

        <div class="readout-chip"><div class="r-val" id="invVal">↓</div><div class="r-lab">связь с «${s.p2.label.toLowerCase()}»</div></div>
      </div>

function initSim(){
  const m = MISSIONS[state.missionId];
  const s = m.sim;
  const canvas = document.getElementById('simCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const p1s=document.getElementById('p1Slider'), p2s=document.getElementById('p2Slider');
  let last1=+p1s.value, last2=+p2s.value, tAnim=0, raf=null;

  function fmtUnit(v,u){
    return (Math.round(v*100)/100)+' '+u;
  }

  function draw(){
    if(!document.getElementById('simCanvas')){ if(raf) cancelAnimationFrame(raf); return; }
    const v1=+p1s.value, v2=+p2s.value;
    const result = s.compute(v1,v2);
    document.getElementById('p1Val').textContent = fmtUnit(v1,s.p1.unit);
    document.getElementById('p2Val').textContent = fmtUnit(v2,s.p2.unit);
    document.getElementById('rVal').textContent = result.toFixed(s.decimals);
    document.getElementById('dirVal').textContent = v1>=last1? '↑ растёт вместе':'↓ падает вместе';
    document.getElementById('invVal').textContent = v2>=last2? '↓ обычно снижает результат':'↑ обычно повышает результат';
    last1=v1; last2=v2;

    ctx.clearRect(0,0,900,260);
    ctx.fillStyle='#EAF1FF'; ctx.fillRect(0,0,900,260);

    drawVisual(s.visual, ctx, v1, v2, result, tAnim, s);
    drawBars(ctx, s, v1, v2);

    tAnim+=0.08;
    raf = requestAnimationFrame(draw);
  }
  draw();
}

function drawBars(ctx, s, v1, v2){
  const barMax=190, x=555;
  const w1 = Math.min(barMax, ((v1-s.p1.min)/(s.p1.max-s.p1.min))*barMax);
  ctx.fillStyle='#DCE4F0'; ctx.fillRect(x,70,barMax,14);
  ctx.fillStyle='#2F6FED'; ctx.fillRect(x,70,w1,14);
  ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText(s.p1.label,x,60);

  const w2 = Math.min(barMax, ((v2-s.p2.min)/(s.p2.max-s.p2.min))*barMax);
  ctx.fillStyle='#DCE4F0'; ctx.fillRect(x,130,barMax,14);
  ctx.fillStyle='#E23F6B'; ctx.fillRect(x,130,w2,14);
  ctx.fillStyle='#5B6B85'; ctx.fillText(s.p2.label,x,120);

  ctx.fillStyle='#5B6B85'; ctx.fillText(s.resultLabel+' ('+s.resultUnit+')',x,180);
  ctx.fillStyle='#101826'; ctx.font='bold 22px Golos Text, Manrope'; ctx.fillText(s.compute(v1,v2).toFixed(s.decimals), x, 210);
}

function drawVisual(type, ctx, v1, v2, result, t, s){
  if(type==='pressure'){
    const cx=270, groundY=190;
    ctx.fillStyle='#DCE4F0'; ctx.fillRect(60,groundY,420,10);
    const dent = Math.min(20, result*1.2);
    ctx.fillStyle='#DCE4F0'; ctx.beginPath(); ctx.ellipse(cx,groundY+2,60,dent*0.4+3,0,0,Math.PI*2); ctx.fill();
    const boxW = 30+Math.sqrt(v2)*6, boxH=50;
    ctx.fillStyle='#2F6FED'; ctx.fillRect(cx-boxW/2, groundY-boxH-dent*0.3, boxW, boxH);
    ctx.fillStyle='#fff'; ctx.font='11px Manrope'; ctx.textAlign='center'; ctx.fillText('S',cx,groundY-boxH/2-dent*0.3); ctx.textAlign='left';
    ctx.strokeStyle='#FF8A3D'; ctx.lineWidth=3;
    for(let i=0;i<3;i++){ const ax=cx-15+i*15; ctx.beginPath(); ctx.moveTo(ax,groundY-boxH-dent*0.3-30-Math.min(20,v1/25)); ctx.lineTo(ax,groundY-boxH-dent*0.3-2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax,groundY-boxH-dent*0.3-2); ctx.lineTo(ax-4,groundY-boxH-dent*0.3-10); ctx.moveTo(ax,groundY-boxH-dent*0.3-2); ctx.lineTo(ax+4,groundY-boxH-dent*0.3-10); ctx.stroke(); }
  }
  else if(type==='density'){
    const cx=250, waterTop=70, waterBottom=190, waterLeft=150, waterRight=350;
    ctx.fillStyle='#DCEBFF'; ctx.fillRect(waterLeft,waterTop,waterRight-waterLeft,waterBottom-waterTop);
    ctx.strokeStyle='#101826'; ctx.lineWidth=2; ctx.strokeRect(waterLeft,waterTop,waterRight-waterLeft,waterBottom-waterTop);
    const size = 14+Math.cbrt(v2)*4;
    const density = result;
    let frac = Math.max(0,Math.min(1,(density-0.3)/(3-0.3)));
    const blockY = waterTop + 6 + frac*(waterBottom-waterTop-size-12);
    ctx.fillStyle='#FF8A3D'; ctx.fillRect(cx-size/2, blockY, size, size);
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('вода (ρ=1 г/см³)',waterLeft,waterTop-8);
  }
  else if(type==='ruler'){
    const left=60, right=460, y=140;
    ctx.strokeStyle='#101826'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke();
    const n = Math.max(2, Math.min(40, Math.round(v2)));
    for(let i=0;i<=n;i++){
      const x = left + (right-left)*(i/n);
      const tall = i%5===0;
      ctx.strokeStyle = tall? '#101826':'#5B6B85'; ctx.lineWidth=tall?2:1;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-(tall?18:10)); ctx.stroke();
    }
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('0',left-6,y+18); ctx.fillText(v1.toFixed(1),right-16,y+18);
    const cursorX = left + (right-left)*((Math.sin(t)*0.5+0.5));
    ctx.fillStyle='#FF8A3D'; ctx.beginPath(); ctx.moveTo(cursorX,y+6); ctx.lineTo(cursorX-6,y+18); ctx.lineTo(cursorX+6,y+18); ctx.closePath(); ctx.fill();
  }
  else if(type==='molecule'){
    const n=10;
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('частицы вещества',60,50);
    for(let i=0;i<n;i++){
      const seed=i*37.13;
      const speed = 0.3+result*0.5;
      const x = 70 + ((Math.sin(t*speed+seed)*0.5+0.5))*380;
      const y = 70 + ((Math.cos(t*speed*1.3+seed)*0.5+0.5))*140;
      ctx.fillStyle='#2F6FED'; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
    }
  }
  else if(type==='molbond'){
    const cx=270, dist=30+v1*35;
    ctx.fillStyle='#2F6FED';
    ctx.beginPath(); ctx.arc(cx-dist/2,130,14,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+dist/2,130,14,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#1FAE7A'; ctx.lineWidth=Math.min(6,1+result);
    ctx.beginPath(); ctx.moveTo(cx-dist/2+14,130); ctx.lineTo(cx+dist/2-14,130); ctx.stroke();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('сила притяжения',cx-46,180);
  }
  else if(type==='path'){
    const trackY=140, left=60, right=460;
    ctx.strokeStyle='#DCE4F0'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(left,trackY); ctx.lineTo(right,trackY); ctx.stroke();
    const frac = Math.min(1, result/2400);
    const shipX = left + (right-left)*frac;
    ctx.fillStyle='#1FAE7A'; ctx.fillRect(left,trackY-3,Math.max(0,shipX-left),6);
    ctx.fillStyle='#101826'; ctx.beginPath(); ctx.arc(shipX,trackY,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('старт',left-6,trackY+24); ctx.fillText('путь: '+result.toFixed(0)+' м',Math.max(left,shipX-30),trackY-16);
  }
  else if(type==='speedo'){
    const cx=250, cy=160, r=90;
    ctx.strokeStyle='#DCE4F0'; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#2F6FED'; ctx.lineWidth=14;
    const frac = Math.min(1, result/33);
    ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*frac); ctx.stroke();
    const angle = Math.PI + Math.PI*frac;
    ctx.strokeStyle='#101826'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(angle)*r*0.8, cy+Math.sin(angle)*r*0.8); ctx.stroke();
    ctx.fillStyle='#101826'; ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('скорость, м/с',cx-42,cy+30);
  }
  else if(type==='inertia'){
    const groundY=190;
    ctx.fillStyle='#DCE4F0'; ctx.fillRect(60,groundY,400,8);
    const size = 20+Math.sqrt(v2)*4;
    const shift = Math.sin(t*3)*Math.min(20,result*3);
    const bx = 250+shift;
    ctx.fillStyle='#FF8A3D'; ctx.fillRect(bx-size/2, groundY-size, size, size);
    ctx.strokeStyle='#101826'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(bx-size/2-30,groundY-size/2); ctx.lineTo(bx-size/2-4,groundY-size/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx-size/2-4,groundY-size/2); ctx.lineTo(bx-size/2-12,groundY-size/2-6); ctx.moveTo(bx-size/2-4,groundY-size/2); ctx.lineTo(bx-size/2-12,groundY-size/2+6); ctx.stroke();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('толчок',bx-size/2-34,groundY-size/2-10);
  }
  else if(type==='spring'){
    const y=130, left=80, coils=10;
    const len = 100+v2*500;
    ctx.strokeStyle='#101826'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(left,y);
    for(let i=0;i<=coils;i++){
      const x = left+ (len/coils)*i;
      const yy = y + (i%2===0? -14:14);
      ctx.lineTo(x,yy);
    }
    ctx.lineTo(left+len+20,y);
    ctx.stroke();
    ctx.fillStyle='#FF8A3D'; ctx.fillRect(left+len+20,y-16,26,32);
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('груз',left+len+22,y+50);
  }
  else if(type==='friction'){
    const groundY=190;
    ctx.fillStyle='#DCE4F0'; ctx.fillRect(60,groundY,400,8);
    const size=24+Math.sqrt(v1)*3;
    const x=250+Math.sin(t)*10;
    ctx.fillStyle='#2F6FED'; ctx.fillRect(x-size/2,groundY-size,size,size);
    ctx.strokeStyle='#E23F6B'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x+size/2+4,groundY-size/2); ctx.lineTo(x+size/2+4+Math.min(60,result/3),groundY-size/2); ctx.stroke();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('Fтр',x+size/2+6,groundY-size/2-8);
  }
  else if(type==='liquidpressure'){
    const left=170, right=350, top=50, bottom=220;
    ctx.fillStyle='#DCEBFF'; ctx.fillRect(left,top,right-left,bottom-top);
    ctx.strokeStyle='#101826'; ctx.lineWidth=2; ctx.strokeRect(left,top,right-left,bottom-top);
    const depthY = top + Math.min(1,v2/10)*(bottom-top);
    ctx.strokeStyle='#FF8A3D'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(left,depthY); ctx.lineTo(right,depthY); ctx.stroke(); ctx.setLineDash([]);
    const dotR = 6+Math.min(14,result/6);
    ctx.fillStyle='#101826'; ctx.beginPath(); ctx.arc((left+right)/2,depthY,dotR,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('h',left-16,depthY+4);
  }
  else if(type==='atmpressure'){
    const baseY=220, left=200;
    ctx.strokeStyle='#101826'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(left,baseY); ctx.lineTo(left,40); ctx.stroke();
    const liftY = baseY - Math.min(180,(v1/9000)*180);
    ctx.fillStyle='#2F6FED'; ctx.fillRect(left-14,liftY-14,28,28);
    ctx.strokeStyle='#101826'; ctx.lineWidth=2; ctx.strokeRect(left+40,baseY-150,14,150);
    const colH = Math.min(150, result*1.4);
    ctx.fillStyle='#5B6B85'; ctx.fillRect(left+40,baseY-colH,14,colH);
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('лифт',left-14,baseY+16); ctx.fillText('барометр',left+34,baseY+16);
  }
  else if(type==='pascal'){
    const baseY=190;
    const smallW=20, bigW=20+Math.sqrt(v2)*8;
    ctx.strokeStyle='#101826'; ctx.lineWidth=2;
    ctx.strokeRect(120,baseY-10,smallW,10);
    ctx.strokeRect(340,baseY-10,bigW,10);
    ctx.beginPath(); ctx.moveTo(140,baseY); ctx.lineTo(340,baseY); ctx.stroke();
    const pushSmall = Math.min(20, v1/25);
    ctx.fillStyle='#FF8A3D'; ctx.fillRect(120,baseY-10-pushSmall-14,smallW,14);
    const pushBig = Math.min(20, result/100);
    ctx.fillStyle='#2F6FED'; ctx.fillRect(340,baseY-10-pushBig-14,bigW,14);
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('F₁',126,baseY-30-pushSmall); ctx.fillText('F₂',340+bigW/2-6,baseY-30-pushBig);
  }
  else if(type==='work'){
    const groundY=190, left=80;
    ctx.fillStyle='#DCE4F0'; ctx.fillRect(60,groundY,420,8);
    const frac = Math.min(1, result/2500);
    const x = left + frac*360;
    ctx.fillStyle='#FF8A3D'; ctx.fillRect(x-16,groundY-32,32,32);
    ctx.strokeStyle='#101826'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(Math.max(60,x-40),groundY-16); ctx.lineTo(x-18,groundY-16); ctx.stroke();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('F',Math.max(60,x-38),groundY-22);
  }
  else if(type==='powerm'){
    const cx=250, cy=140, r=70;
    ctx.strokeStyle='#101826'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    const blades=6;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(t*Math.min(6,result/20));
    for(let i=0;i<blades;i++){
      ctx.rotate(Math.PI*2/blades);
      ctx.fillStyle='#2F6FED'; ctx.fillRect(0,-4,r-10,8);
    }
    ctx.restore();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('двигатель',cx-32,cy+r+20);
  }
  else if(type==='energy'){
    const groundY=210, left=250;
    ctx.strokeStyle='#DCE4F0'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(60,groundY); ctx.lineTo(460,groundY); ctx.stroke();
    const maxH=150;
    const hpx = Math.min(maxH, v2*12);
    const y = groundY - hpx;
    ctx.strokeStyle='#5B6B85'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(left,groundY); ctx.lineTo(left,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#E23F6B'; ctx.beginPath(); ctx.arc(left,y,10+Math.sqrt(v1)/3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5B6B85'; ctx.font='12px Manrope'; ctx.fillText('h',left+10,(y+groundY)/2);
  }
}

function missionArena(m){
  const total = m.tasks.length;
  return `
  <div class="panel" style="padding:26px 26px 8px">
    <h3 style="margin-top:0">Арена заданий</h3>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-8px">${state.taskIndex}/${total} секторов пройдено</p>
    <div class="arena-map">
      ${m.tasks.map((_,i)=>`<div class="arena-node ${i<state.taskIndex?'done':i===state.taskIndex?'current':''}">${i<state.taskIndex?'✓':i+1}</div>${i<total-1?`<div class="arena-line ${i<state.taskIndex?'done':''}"></div>`:''}`).join('')}
    </div>
  </div>
  ${renderTask(m)}`;
}

function renderTask(m){
  if(state.taskIndex>=m.tasks.length){
    return `<div class="panel task-card" style="text-align:center">
      <h3>Все секторы пройдены!</h3>
      <p style="color:var(--ink-soft)">Правильных ответов: ${state.score} из ${m.tasks.length}. Миссия выполнена.</p>
      <button class="btn btn-primary" onclick="go('mission',{missionId:'${state.missionId}',missionStep:'reward'})">Получить награду →</button>
    </div>`;
  }
  const t = m.tasks[state.taskIndex];
  const type = t.type || 'mcq';
  if(type==='match') return renderMatchTask(t);
  if(type==='experiment') return renderExperimentTask(m,t);
  if(type==='crossword') return renderCrosswordTask(t);
  if(type==='wheel') return renderWheelTask(t);
  if(type==='flip') return renderFlipTask(t);
  if(type==='sequence') return renderSequenceTask(t);
  return renderMcqTask(t);
}

function renderMcqTask(t){
  return `
  <div class="panel task-card">
    <div class="task-tag">${t.tag}</div>
    <div class="task-prompt">${t.prompt}</div>
    ${t.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answerTask(${i})">${o}</button>`).join('')}
    <div class="explain" id="explainBox">${t.explain}</div>
    <div class="task-nav">
      <span></span>
      <button class="btn btn-primary" id="nextBtn" style="display:none" onclick="nextTask()">Следующий сектор →</button>
    </div>
  </div>`;
}

function answerTask(i){
  if(state.taskAnswered) return;
  state.taskAnswered = true;
  const m = MISSIONS[state.missionId];
  const t = m.tasks[state.taskIndex];
  document.getElementById('opt'+i).classList.add(i===t.correct?'correct':'wrong');
  if(i!==t.correct) document.getElementById('opt'+t.correct).classList.add('correct');
  if(i===t.correct) state.score++;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  document.getElementById('explainBox').style.display='block';
  document.getElementById('nextBtn').style.display='inline-block';
}

/* ---- Задание-пазл: сопоставление понятий ---- */
function ensureMatchState(t){
  const key = state.missionId+':'+state.taskIndex;
  if(state.matchFor !== key){
    state.matchFor = key;
    state.matchMatched = t.pairs.map(()=>false);
    state.matchSelectedTerm = null;
    state.matchWrongFlash = null;
    state.matchScored = false;
    state.matchShuffle = t.pairs.map((_,i)=>i);
    for(let i=state.matchShuffle.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [state.matchShuffle[i],state.matchShuffle[j]]=[state.matchShuffle[j],state.matchShuffle[i]]; }
  }
}
function renderMatchTask(t){
  ensureMatchState(t);
  const allMatched = state.matchMatched.every(Boolean);
  return `
  <div class="panel task-card">
    <div class="task-tag">${t.tag} · пазл-сопоставление</div>
    <div class="task-prompt">${t.prompt}</div>
    <div class="match-grid">
      <div class="match-col">
        ${t.pairs.map((p,i)=>`<button class="match-term ${state.matchMatched[i]?'matched':''} ${state.matchSelectedTerm===i?'selected':''} ${state.matchWrongFlash&&state.matchWrongFlash.term===i?'wrong':''}" onclick="pickTerm(${i})">${p.term}</button>`).join('')}
      </div>
      <div class="match-col">
        ${state.matchShuffle.map(origIdx=>`<button class="match-def ${state.matchMatched[origIdx]?'matched':''} ${state.matchWrongFlash&&state.matchWrongFlash.def===origIdx?'wrong':''}" onclick="pickDef(${origIdx})">${t.pairs[origIdx].def}</button>`).join('')}
      </div>
    </div>
    ${allMatched
      ? `<div class="explain" style="display:block">${t.explain}</div><div class="task-nav"><span></span><button class="btn btn-primary" onclick="nextTask()">Следующий сектор →</button></div>`
      : `<p class="match-hint">Нажми термин слева, затем подходящее определение справа.</p>`}
  </div>`;
}
function pickTerm(i){
  if(state.matchMatched[i]) return;
  state.matchSelectedTerm = i;
  render();
}
function pickDef(origIdx){
  if(state.matchSelectedTerm===null || state.matchMatched[origIdx]) return;
  if(state.matchSelectedTerm===origIdx){
    state.matchMatched[origIdx]=true;
    state.matchSelectedTerm=null;
    if(state.matchMatched.every(Boolean) && !state.matchScored){ state.score++; state.matchScored=true; }
    render();
  } else {
    state.matchWrongFlash = {term:state.matchSelectedTerm, def:origIdx};
    state.matchSelectedTerm=null;
    render();
    setTimeout(()=>{ state.matchWrongFlash=null; render(); }, 550);
  }
}

/* ---- Задание-опыт ---- */
function ensureExpState(){
  const key = state.missionId+':'+state.taskIndex;
  if(state.expFor !== key){ state.expFor = key; state.expDone = false; }
}
function renderExperimentTask(m,t){
  ensureExpState();
  const s = m.sim;
  return `
  <div class="panel task-card">
    <div class="task-tag">${t.tag} · опыт в симуляторе</div>
    <div class="task-prompt">${t.prompt}</div>
    <div class="sim-canvas-wrap" style="margin-bottom:16px"><canvas id="expCanvas" width="900" height="200"></canvas></div>
    <div class="sim-controls">
      <div class="slider-row"><label>${s.p1.label} <span id="ep1Val">${s.p1.def} ${s.p1.unit}</span></label><input type="range" id="ep1Slider" min="${s.p1.min}" max="${s.p1.max}" step="${s.p1.step}" value="${s.p1.def}"></div>
      <div class="slider-row"><label>${s.p2.label} <span id="ep2Val">${s.p2.def} ${s.p2.unit}</span></label><input type="range" id="ep2Slider" min="${s.p2.min}" max="${s.p2.max}" step="${s.p2.step}" value="${s.p2.def}"></div>
      <div class="sim-readout"><div class="readout-chip"><div class="r-val" id="erVal">–</div><div class="r-lab">${s.resultLabel}, ${s.resultUnit}</div></div></div>
    </div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="checkExperiment()">Проверить результат</button>
    <div id="expMsg" style="margin-top:10px"></div>
    ${state.expDone ? `<div class="explain" style="display:block">${t.explain}</div><div class="task-nav"><span></span><button class="btn btn-primary" onclick="nextTask()">Следующий сектор →</button></div>` : ''}
  </div>`;
}
function initExperiment(){
  const m = MISSIONS[state.missionId], s = m.sim;
  const canvas = document.getElementById('expCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const p1s=document.getElementById('ep1Slider'), p2s=document.getElementById('ep2Slider');
  let tAnim=0, raf=null;
  function draw(){
    if(!document.getElementById('expCanvas')){ if(raf) cancelAnimationFrame(raf); return; }
    const v1=+p1s.value, v2=+p2s.value, result=s.compute(v1,v2);
    document.getElementById('ep1Val').textContent = (Math.round(v1*100)/100)+' '+s.p1.unit;
    document.getElementById('ep2Val').textContent = (Math.round(v2*100)/100)+' '+s.p2.unit;
    document.getElementById('erVal').textContent = result.toFixed(s.decimals);
    ctx.clearRect(0,0,900,200); ctx.fillStyle='#EAF1FF'; ctx.fillRect(0,0,900,200);
    drawVisual(s.visual, ctx, v1, v2, result, tAnim, s);
    tAnim+=0.08;
    raf = requestAnimationFrame(draw);
  }
  draw();
}
function checkExperiment(){
  const m = MISSIONS[state.missionId], t = m.tasks[state.taskIndex], s = m.sim;
  const v1=+document.getElementById('ep1Slider').value, v2=+document.getElementById('ep2Slider').value;
  const result = s.compute(v1,v2);
  const msg = document.getElementById('expMsg');
  if(result>=t.targetMin && result<=t.targetMax){
    if(!state.expDone) state.score++;
    state.expDone = true;
    render();
  } else {
    msg.innerHTML = '<span class="exp-msg-no">Пока не то — попробуй другие значения ползунков.</span>';
  }
}

/* ---- Задание-кроссворд: печать целиком, буквы сами занимают клетки ---- */
function ensureCrossState(){
  const key = state.missionId+':'+state.taskIndex;
  if(state.crossFor !== key){ state.crossFor = key; state.crossDone = false; }
}
function renderCrosswordTask(t){
  ensureCrossState();
  return `
  <div class="panel task-card">
    <div class="task-tag">${t.tag} · кроссворд</div>
    <div class="task-prompt">${t.prompt}</div>
    <div class="cross-grid">
      ${t.words.map((w,wi)=>`
        <div class="cross-row">
          <div class="cross-num">${wi+1}.</div>
          <div class="cross-clue">${w.clue}</div>
          <div class="cross-letters" data-word="${wi}">
            ${w.answer.split('').map((ch,li)=>`<input class="cross-cell" id="cw_${wi}_${li}" data-word="${wi}" data-idx="${li}" maxlength="1" autocomplete="off" autocapitalize="characters">`).join('')}
          </div>
        </div>`).join('')}
    </div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="checkCrossword()">Проверить кроссворд</button>
    <div id="crossMsg" style="margin-top:10px"></div>
    ${state.crossDone ? `<div class="explain" style="display:block">${t.explain}</div><div class="task-nav"><span></span><button class="btn btn-primary" onclick="nextTask()">Следующий сектор →</button></div>` : ''}
  </div>`;
}
function initCrosswordInputs(){
  const m=MISSIONS[state.missionId], t=m.tasks[state.taskIndex];
  if(!t || t.type!=='crossword') return;
  t.words.forEach((w,wi)=>{
    w.answer.split('').forEach((ch,li)=>{
      const el = document.getElementById('cw_'+wi+'_'+li);
      if(!el) return;
      el.addEventListener('input', (e)=>{
        let val = e.target.value.toUpperCase().replace(/[^А-ЯЁA-Z]/g,'');
        if(val.length>1){
          // печать/вставка нескольких букв сразу — распределяем по следующим клеткам
          const chars = val.split('');
          let idx = li;
          chars.forEach(c=>{
            const cell = document.getElementById('cw_'+wi+'_'+idx);
            if(cell && idx<w.answer.length){ cell.value=c; idx++; }
          });
          const next = document.getElementById('cw_'+wi+'_'+Math.min(idx,w.answer.length-1));
          if(next) next.focus();
          return;
        }
        e.target.value = val;
        if(val && li<w.answer.length-1){
          const next = document.getElementById('cw_'+wi+'_'+(li+1));
          if(next) next.focus();
        }
      });
      el.addEventListener('paste',(e)=>{
        e.preventDefault();
        const text=(e.clipboardData||window.clipboardData).getData('text').toUpperCase().replace(/[^А-ЯЁA-Z]/g,'');
        let idx=li;
        text.split('').forEach(c=>{
          const cell=document.getElementById('cw_'+wi+'_'+idx);
          if(cell && idx<w.answer.length){ cell.value=c; idx++; }
        });
        const next=document.getElementById('cw_'+wi+'_'+Math.min(idx,w.answer.length-1));
        if(next) next.focus();
      });
      el.addEventListener('keydown',(e)=>{
        if(e.key==='Backspace' && !e.target.value && li>0){
          const prev = document.getElementById('cw_'+wi+'_'+(li-1));
          if(prev){ prev.focus(); }
        } else if(e.key==='ArrowRight' && li<w.answer.length-1){
          document.getElementById('cw_'+wi+'_'+(li+1))?.focus();
        } else if(e.key==='ArrowLeft' && li>0){
          document.getElementById('cw_'+wi+'_'+(li-1))?.focus();
        }
      });
    });
  });
}
function checkCrossword(){
  const m=MISSIONS[state.missionId], t=m.tasks[state.taskIndex];
  let allOk=true;
  t.words.forEach((w,wi)=>{
    w.answer.split('').forEach((ch,li)=>{
      const el = document.getElementById('cw_'+wi+'_'+li);
      const ok = el.value.trim().toUpperCase()===ch;
      el.classList.remove('correct','wrong');
      el.classList.add(ok?'correct':'wrong');
      if(!ok) allOk=false;
    });
  });
  const msg = document.getElementById('crossMsg');
  if(allOk){
    if(!state.crossDone) state.score++;
    state.crossDone = true;
    render();
  } else {
    msg.innerHTML = '<span class="exp-msg-no">Есть ошибки — проверь подсветку клеток и попробуй снова.</span>';
  }
}

/* ---- Задание-колесо фортуны: крутим напрямую через DOM, без полного ре-рендера ---- */
function ensureWheelState(){
  const key = state.missionId+':'+state.taskIndex;
  if(state.wheelFor !== key){ state.wheelFor = key; state.wheelSpun=false; state.wheelAnswered=false; state.wheelSegment=null; state.wheelRotation=0; }
}
function renderWheelTask(t){
  ensureWheelState();
  const n = t.segments.length;
  const colors = ['#2F6FED','#FF8A3D','#1FAE7A','#E23F6B','#1B4FC7','#E6701F'];
  const segAngle = 360/n;
  const gradient = t.segments.map((s,i)=>`${colors[i%colors.length]} ${i*segAngle}deg ${(i+1)*segAngle}deg`).join(',');
  const labelsHtml = t.segments.map((s,i)=>{
    const mid = i*segAngle + segAngle/2;
    return `<span class="wheel-label" style="transform:rotate(${mid}deg) translate(10px,-6px);">${s.label}</span>`;
  }).join('');
  return `
  <div class="panel task-card">
    <div class="task-tag">${t.tag} · колесо фортуны</div>
    <div class="task-prompt">${t.prompt}</div>
    <div class="wheel-wrap">
      <div class="wheel-outer">
        <div class="wheel-pointer"></div>
        <div id="wheelDisk" class="wheel-disk" style="background:conic-gradient(${gradient});transform:rotate(${state.wheelRotation}deg);">${labelsHtml}</div>
      </div>
      ${!state.wheelSpun ? `<button class="btn btn-primary" id="spinBtn" onclick="spinWheel()">Крутить колесо</button>` : ''}
      <div class="wheel-sub" id="wheelSub"></div>
    </div>
  </div>`;
}
function spinWheel(){
  const m=MISSIONS[state.missionId], t=m.tasks[state.taskIndex];
  const n=t.segments.length, segAngle=360/n;
  const chosen = Math.floor(Math.random()*n);
  const extraSpins = 4+Math.floor(Math.random()*3);
  const target = 360*extraSpins + (360 - (chosen*segAngle+segAngle/2));
  state.wheelSpun = true;
  state.wheelSegment = chosen;
  state.wheelRotation = target;
  const disk = document.getElementById('wheelDisk');
  const btn = document.getElementById('spinBtn');
  if(btn) btn.remove();
  if(disk){
    // форсируем применение стартового состояния перед сменой transform, чтобы transition сработал
    disk.style.transition = 'none';
    void disk.offsetWidth;
    disk.style.transition = 'transform 4s cubic-bezier(.15,.7,.25,1)';
    requestAnimationFrame(()=>{
      disk.style.transform = 'rotate('+target+'deg)';
    });
  }
  setTimeout(()=>{ showWheelQuestion(); }, 4150);
}
function showWheelQuestion(){
  const m=MISSIONS[state.missionId], t=m.tasks[state.taskIndex];
  const seg = t.segments[state.wheelSegment];
  const box = document.getElementById('wheelSub');
  if(!box) return;
  box.innerHTML = `<div class="task-prompt" style="margin-top:14px;font-size:16px">${seg.question}</div>
    ${seg.opts.map((o,i)=>`<button class="opt" id="wopt${i}" onclick="answerWheel(${i})">${o}</button>`).join('')}
    <div class="explain" id="wheelExplain">${seg.explain}</div>
    <div class="task-nav"><span></span><button class="btn btn-primary" id="wheelNextBtn" style="display:none" onclick="nextTask()">Следующий сектор →</button></div>`;
}
function answerWheel(i){
  if(state.wheelAnswered) return;
  state.wheelAnswered = true;
  const m=MISSIONS[state.missionId], t=m.tasks[state.taskIndex], seg=t.segments[state.wheelSegment];
  document.getElementById('wopt'+i).classList.add(i===seg.correct?'correct':'wrong');
  if(i!==seg.correct) document.getElementById('wopt'+seg.correct).classList.add('correct');
  if(i===seg.correct) state.score++;
  document.querySelectorAll('#wheelSub .opt').forEach(b=>b.onclick=null);
  document.getElementById('wheelExplain').style.display='block';
  document.getElementById('wheelNextBtn').style.display='inline-block';
}

/* ---- Задание-карточки: переворот ---- */
function ensureFlipState(t){
  const key=state.missionId+':'+state.taskIndex;
  if(state.flipFor!==key){ state.flipFor=key; state.flipOpened=t.cards.map(()=>false); state.flipScored=false; }
}
function renderFlipTask(t){
  ensureFlipState(t);
  const all=state.flipOpened.every(Boolean);
  return `
  <div class="panel task-card">
    <div class="task-tag">${t.tag} · переворачивающиеся карточки</div>
    <div class="task-prompt">${t.prompt}</div>
    <div class="flip-grid">
      ${t.cards.map((c,i)=>`
        <div class="flip-card ${state.flipOpened[i]?'flipped':''}" onclick="flipCard(${i})">
          <div class="flip-inner">
            <div class="flip-front"><div class="flip-mark">↻</div><h4>${c.front}</h4><p>Нажми, чтобы перевернуть</p></div>
            <div class="flip-back"><h4>${c.front}</h4><p>${c.back}</p></div>
          </div>
        </div>`).join('')}
    </div>
    ${all
      ? `<div class="explain" style="display:block">${t.explain}</div><div class="task-nav"><span></span><button class="btn btn-primary" onclick="nextTask()">Следующий сектор →</button></div>`
      : `<p class="match-hint">Открой все карточки — после этого сектор будет засчитан.</p>`}
  </div>`;
}
function flipCard(i){
  if(state.flipOpened[i]) return;
  state.flipOpened[i]=true;
  if(state.flipOpened.every(Boolean) && !state.flipScored){state.score++;state.flipScored=true;}
  render();
}

/* ---- Задание-последовательность ---- */
function ensureSequenceState(t){
  const key=state.missionId+':'+state.taskIndex;
  if(state.seqFor!==key){
    state.seqFor=key;
    state.seqOrder=t.items.map((_,i)=>i);
    for(let i=state.seqOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.seqOrder[i],state.seqOrder[j]]=[state.seqOrder[j],state.seqOrder[i]];}
    state.seqSelected=[];
    state.seqDone=false;
  }
}
function renderSequenceTask(t){
  ensureSequenceState(t);
  return `
  <div class="panel task-card">
    <div class="task-tag">${t.tag} · интерактивный алгоритм</div>
    <div class="task-prompt">${t.prompt}</div>
    <p class="match-hint">Нажимай шаги в том порядке, в котором их нужно выполнять.</p>
    <div class="sequence-list">
      ${state.seqOrder.map(i=>{
        const chosen=state.seqSelected.includes(i);
        const pos=state.seqSelected.indexOf(i);
        return `<button class="sequence-item ${chosen?'selected':''}" onclick="pickSequence(${i})" ${chosen?'disabled':''}>
          <span class="sequence-num">${chosen?pos+1:'•'}</span><span>${t.items[i]}</span>
        </button>`;
      }).join('')}
    </div>
    <div id="seqStatus" class="sequence-status"></div>
    ${state.seqDone?`<div class="explain" style="display:block">${t.explain}</div><div class="task-nav"><span></span><button class="btn btn-primary" onclick="nextTask()">Следующий сектор →</button></div>`:''}
  </div>`;
}
function pickSequence(i){
  if(state.seqDone || state.seqSelected.includes(i)) return;
  state.seqSelected.push(i);
  const t=MISSIONS[state.missionId].tasks[state.taskIndex];
  const expected=state.seqSelected.length-1;
  const correctSoFar=state.seqSelected[expected]===expected;
  if(!correctSoFar){
    const chosen=state.seqSelected[state.seqSelected.length-1];
    state.seqSelected=[];
    state.seqWrongFlash=chosen;
    render();
    setTimeout(()=>{state.seqWrongFlash=null;render();},500);
    return;
  }
  if(state.seqSelected.length===t.items.length){
    state.seqDone=true;
    if(!state.seqScored){state.score++;state.seqScored=true;}
  }
  render();
}

function nextTask(){
  state.taskIndex++;
  state.taskAnswered=false;
  render();
}

/* ================= НАГРАДА: 0-50% — без награды; 51-100% — награда фиксируется один раз ================= */
function recommendationFor(percent){
  if(percent<=50) return 'Стоит вернуться к теории и симулятору этой темы и пройти арену ещё раз — так материал закрепится лучше.';
  if(percent<=70) return 'Неплохой результат! Повтори задания, где ошибся, — и в следующий раз результат будет ещё выше.';
  if(percent<=90) return 'Отличная работа — тема освоена уверенно. Обрати внимание на пропущенные вопросы для полного результата.';
  return 'Превосходно! Тема усвоена полностью — можно переходить к следующей миссии.';
}
function missionReward(m){
  const total = m.tasks.length;
  const correct = state.score;
  const wrong = total - correct;
  const percent = total>0 ? Math.round((state.score/total)*100) : 0;
  const score10 = percentToScore10(percent);
  const tier = tierForPercent(percent);
  const durationSec = state.arenaStartTs ? Math.round((Date.now()-state.arenaStartTs)/1000) : 0;
  if(state.rewardFor !== state.missionId+':'+state.score+':'+total){
    // новая попытка — сохраняем результат один раз и, если положена награда, фиксируем её один раз
    state.rewardFor = state.missionId+':'+state.score+':'+total;
    state.rewardRevealed = false;
    state.rewardTier = tier;
    state.rewardItem = null;
    if(tier){
      const pool = REWARDS[tier];
      state.rewardItem = pool[Math.floor(Math.random()*pool.length)];
    }
    recordAttempt(state.missionId, correct, total, correct, wrong, tier, state.rewardItem, durationSec);
  }
  const statsBlock = `
    <div class="stat-mini-row" style="justify-content:center">
      <div class="stat-mini"><div class="sm-val">${correct}/${total}</div><div class="sm-lab">верно / всего</div></div>
      <div class="stat-mini"><div class="sm-val">${percent}%</div><div class="sm-lab">процент выполнения</div></div>
      <div class="stat-mini"><div class="sm-val">${score10}/10</div><div class="sm-lab">оценка по 10-балльной шкале</div></div>
      <div class="stat-mini"><div class="sm-val">${formatDuration(durationSec)}</div><div class="sm-lab">затраченное время</div></div>
    </div>
    <p style="color:var(--ink-soft);font-size:13.5px;max-width:460px;margin:0 auto 6px">${recommendationFor(percent)}</p>`;
  if(!tier){
    return `
    <div class="panel reward-wrap">
      <h3>Капсула пока заблокирована</h3>
      ${statsBlock}
      <p style="color:var(--ink-soft);font-size:13px">Чтобы получить награду, нужно верно выполнить больше половины заданий арены (от 51%).</p>
      <div class="capsule" style="opacity:.35;cursor:not-allowed;filter:grayscale(1)">🔒</div>
      <button class="btn btn-ghost" style="margin-top:18px" onclick="restartArena()">Пройти арену снова →</button>
    </div>`;
  }
  return `
  <div class="panel reward-wrap">
    <h3>Капсула с наградой</h3>
    ${statsBlock}
    <p style="color:var(--ink-soft);font-size:13px">Капсула открыта! Нажми на неё один раз, чтобы узнать награду.</p>
    <div class="capsule ${tier}" onclick="openReward()">🎁</div>
    <div class="reward-result" id="rewardResult" style="${state.rewardRevealed?'display:block':''}">
      ${state.rewardRevealed?`<div class="reward-tier-label ${tier}">${TIER_LABEL[tier]}</div><h3>${state.rewardItem.title}</h3><p>${state.rewardItem.text}</p>`:''}
    </div>
    <button class="btn btn-ghost" style="margin-top:22px" onclick="restartArena()">Пройти арену снова →</button>
  </div>`;
}
function openReward(){
  // награда фиксируется при входе в этот шаг и больше не меняется по клику — просто показываем её
  state.rewardRevealed = true;
  render();
}
function restartArena(){
  enterArena(state.missionId);
}

/* ================= ПОДЕЛИТЬСЯ ================= */
function getShareUrl(){
  const u=new URL(window.location.href);
  u.searchParams.set('section',state.section==null?'':state.section);
  u.searchParams.set('mission',(state.view==='mission'||state.view==='results')?state.missionId:'');
  u.searchParams.set('step',state.view==='mission'?state.missionStep:'');
  u.searchParams.set('view',state.view==='results'?'results':'');
  return u.toString();
}
async function shareProject(){
  const url=getShareUrl();
  try{
    if(navigator.share){await navigator.share({title:'«Эврика!» — физика 7 класс',text:'Интерактивный курс физики для 7 класса',url});}
    else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Ссылка скопирована. Отправь её ученикам или коллегам — она откроется у любого, кто перейдёт по ней (если сайт размещён в интернете).');}
    else{prompt('Скопируй ссылку:',url);}
  }catch(e){}
}

function restoreFromUrl(){
  const p=new URLSearchParams(window.location.search);
  const mid=p.get('mission');
  if(mid && MISSIONS[mid]){
    state.missionId=mid;
    state.section=null;state.taskIndex=0;state.score=0;
    if(p.get('view')==='results'){ state.view='results'; }
    else { state.view='mission'; state.missionStep=STEPS.includes(p.get('step'))?p.get('step'):'intro'; }
    return;
  }
  const sec=p.get('section');
  if(sec!==null && sec!==''){
    state.view='section';
    state.section=Number(sec);
  }
}

/* ================= INIT ================= */
restoreFromUrl();
render();
setTimeout(()=>{ document.getElementById('splash')?.classList.add('hide'); setTimeout(()=>document.getElementById('splash')?.remove(),1100); }, 2500);

/* Регистрация service worker для оффлайн-доступа и установки как приложения */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
